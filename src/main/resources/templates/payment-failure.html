<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Failed</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box;
            font-family:'Segoe UI', sans-serif; }
        body {
            background:#f0f2f5; display:flex;
            justify-content:center; align-items:center;
            min-height:100vh;
        }
        .card {
            background:white; border-radius:16px;
            padding:40px; text-align:center;
            max-width:400px; width:90%;
            box-shadow:0 8px 30px rgba(0,0,0,0.1);
        }
        .icon {
            font-size:60px; margin-bottom:15px;
        }
        h2 { color:#dc2626; font-size:22px; margin-bottom:10px; }
        p { color:#64748b; font-size:14px; margin-bottom:25px; }
        .btn {
            display:inline-block; padding:12px 28px;
            background:#007bff; color:white;
            border-radius:10px; text-decoration:none;
            font-weight:700; font-size:14px; margin:5px;
        }
        .btn-outline {
            background:white; color:#007bff;
            border:2px solid #007bff;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">❌</div>
        <h2>Payment Failed</h2>
        <p>Your payment was not completed. Your booking is still pending. Please try again or contact support.</p>
        <a th:href="@{/home}" class="btn">Go to Home</a>
        <a th:href="@{/booking/my-bookings}"
           class="btn btn-outline">
            My Bookings
        </a>
    </div>
</body>
</html>
